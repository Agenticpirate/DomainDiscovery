<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <filter id="metallic">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#silverGradient)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  
  <!-- Diamond/Hexagon shape -->
  <path 
    d="M32 12L12 22V42L32 52L52 42V22L32 12Z" 
    stroke="#475569" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
    filter="url(#metallic)"
  />
  
  <!-- Inner circle -->
  <circle 
    cx="32" 
    cy="32" 
    r="10" 
    fill="#475569"
    opacity="0.9"
    filter="url(#metallic)"
  />
  
  <!-- Center highlight -->
  <circle cx="32" cy="32" r="4" fill="white" fill-opacity="0.6" />
</svg>

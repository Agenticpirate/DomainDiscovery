<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="metallic">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo with glow -->
  <g transform="translate(500, 200)">
    <ellipse cx="100" cy="100" rx="130" ry="130" fill="#94a3b8" opacity="0.2" filter="url(#glow)"/>
    <rect x="20" y="20" width="160" height="160" rx="32" fill="url(#silverGradient)" filter="url(#metallic)"/>
    <rect x="20" y="20" width="160" height="160" rx="32" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <path 
      d="M100 55L55 72V128L100 145L145 128V72L100 55Z" 
      stroke="#475569" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none"
      filter="url(#metallic)"
    />
    <circle 
      cx="100" 
      cy="100" 
      r="25" 
      fill="#475569"
      opacity="0.9"
      filter="url(#metallic)"
    />
    <circle cx="100" cy="100" r="10" fill="white" fill-opacity="0.6" />
  </g>
  
  <!-- Text -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle">
    DomainsDiscovery
  </text>
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" text-anchor="middle">
    AI-POWERED DOMAIN SEARCH &amp; GENERATOR TOOLS
  </text>
  
  <!-- Features -->
  <g transform="translate(250, 400)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.7)">
      ✓ Instant Domain Search
    </text>
    <text x="250" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.7)">
      ✓ Bulk Checker
    </text>
    <text x="450" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.7)">
      ✓ 1,600+ TLDs
    </text>
  </g>
</svg>
